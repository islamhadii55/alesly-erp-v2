{% extends "base.html" %}
{% set title = "كاشير بيع قطع الغيار" %}
{% block content %}
<div class="panel" style="margin-bottom:14px">
  <div class="panel-h"><h3>الوردية</h3></div>
  <div class="panel-b">
    {% if shift %}
    <form method="post" action="{{ url_for('shift_close') }}" class="form-grid">
      <div class="field"><label>افتتحت</label><input value="{{ shift.started_at }}" disabled></div>
      <div class="field"><label>النقد الفعلي عند الإغلاق</label><input type="number" step="0.01" name="actual_cash" required></div>
      <div class="field"><label>ملاحظة</label><input name="notes"></div>
      <div><button class="btn btn-danger">إغلاق الوردية</button></div>
    </form>
    {% else %}
    <form method="post" action="{{ url_for('shift_open') }}" class="form-grid">
      <div class="field"><label>عهدة الافتتاح</label><input type="number" step="0.01" name="opening_cash" value="0"></div>
      <div><button class="btn btn-gold">فتح وردية</button></div>
    </form>
    {% endif %}
  </div>
</div>
<form method="post" id="inv-form">
  <div class="panel" style="margin-bottom:14px">
    <div class="panel-h"><h3>نقطة البيع السريعة</h3></div>
    <div class="panel-b form-grid">
      <div class="field">
        <label>العميل</label>
        <input type="hidden" name="party_id" id="party-id">
        <input data-suggest="customer" data-target="#party-id" name="party_search" placeholder="اكتب اسم العميل أو اتركه نقدي عام">
      </div>
      <div class="field"><label>الاسم الظاهر</label><input name="party_name" id="party-name" value="عميل نقدي"></div>
      <div class="field"><label>طريقة الدفع</label>
        <select name="payment_method">{% for m in pay_methods %}<option>{{ m }}</option>{% endfor %}</select>
      </div>
      <div class="field"><label>الخصم</label><input type="number" step="0.01" name="discount" value="0"></div>
      <div class="field"><label>كود كوبون</label><input name="coupon_code" placeholder="SAVE10"></div>
      <div class="field"><label>عدد الأقساط</label><input type="number" name="installments_count" value="0" min="0"></div>
      <div class="field"><label>ضريبة القيمة المضافة</label><input type="number" step="0.01" name="tax" id="tax-field" value="0"></div>
      <div class="field"><label>مسح باركود / كود صنف</label><input id="barcode-scan" placeholder="امسح أو اكتب ثم Enter" autocomplete="off"></div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-h">
      <h3>الأصناف</h3>
      <button type="button" class="btn btn-ghost" onclick="addProductRow()">إضافة بند</button>
    </div>
    <div class="panel-b">
      <table id="items">
        <thead><tr><th>المنتج</th><th>الوصف</th><th>الكمية</th><th>التكلفة</th><th>السعر</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
      <div style="margin-top:14px"><button class="btn btn-gold">إصدار الفاتورة وطباعتها</button></div>
    </div>
  </div>
</form>
<template id="row-tpl">
  <tr>
    <td>
      <input type="hidden" name="item_product_id[]" value="">
      <input class="item-search" placeholder="اكتب حرفاً أو امسح باركود">
    </td>
    <td><input name="item_desc[]"></td>
    <td><input name="item_qty[]" type="number" step="0.01" value="1"></td>
    <td><input name="item_cost[]" type="number" step="0.01" value="0"></td>
    <td><input name="item_price[]" type="number" step="0.01" value="0"></td>
    <td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove()">حذف</button></td>
  </tr>
</template>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('barcode-scan').addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  e.preventDefault();
  const code = this.value.trim();
  if(!code) return;
  fetch('/api/barcode?code=' + encodeURIComponent(code)).then(r=>r.json()).then(p=>{
    if(!p.id){ alert('الصنف غير موجود'); return; }
    addProductRow();
    const row = document.querySelector('#items tbody tr:last-child');
    row.querySelector('[name="item_product_id[]"]').value = p.id;
    row.querySelector('.item-search').value = (p.sku||'') + ' — ' + p.name;
    row.querySelector('[name="item_desc[]"]').value = p.name;
    row.querySelector('[name="item_cost[]"]').value = p.cost;
    row.querySelector('[name="item_price[]"]').value = p.price;
  });
  this.value='';
});
</script>
{% endblock %}
