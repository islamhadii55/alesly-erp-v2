{% extends "base.html" %}
{% set title = "أمر شراء جديد" %}
{% block content %}<form method="post"><div class="panel" style="margin-bottom:14px"><div class="panel-h"><h3>بيانات التوريد</h3></div><div class="panel-b form-grid"><div class="field"><label>المورد</label><select name="supplier_id"><option value="">مورد غير محدد</option>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></div><div class="field"><label>اسم مورد جديد / ظاهر</label><input name="supplier_name"></div><div class="field"><label>تاريخ الأمر</label><input type="date" name="order_date" value="{{ today }}"></div><div class="field"><label>التوريد المتوقع</label><input type="date" name="expected_date"></div><div class="field full"><label>ملاحظات</label><input name="notes"></div></div></div><div class="panel"><div class="panel-h"><h3>الأصناف</h3><button type="button" class="btn btn-ghost" onclick="addRow()">إضافة بند</button></div><div class="panel-b"><table id="items"><tr><th>الصنف</th><th>الوصف</th><th>الكمية</th><th>تكلفة الوحدة</th><th></th></tr><tr><td><select name="item_product_id[]"><option value="">غير مرتبط</option>{% for p in products %}<option value="{{ p.id }}">{{ p.sku }} — {{ p.name }}</option>{% endfor %}</select></td><td><input name="item_desc[]" required></td><td><input name="item_qty[]" type="number" step="0.01" value="1"></td><td><input name="item_cost[]" type="number" step="0.01" value="0"></td><td><button type="button" class="btn btn-danger" onclick="this.closest('tr').remove()">حذف</button></td></tr></table><div style="margin-top:14px"><button class="btn btn-gold">حفظ كمسودة</button> <a class="btn btn-ghost" href="{{ url_for('supply_chain') }}">إلغاء</a></div></div></div></form>{% block scripts %}<script>function addRow(){const r=document.querySelector('#items tr:last-child').cloneNode(true);r.querySelectorAll('input').forEach(x=>x.value=x.name.includes('qty')?'1':x.name.includes('cost')?'':'');r.querySelector('select').selectedIndex=0;document.querySelector('#items').appendChild(r)}</script>{% endblock %}{% endblock %}
